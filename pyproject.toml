[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-core"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "uvicorn>=0.30,<0.31",
    "sqlmodel>=0.0.22,<0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["lab03/monolith/assistant_monolith.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
